<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D120B" media="(prefers-color-scheme: dark)">
<title>Caderno de Prática</title>
<script>
  /* aplica o tema escolhido antes de desenhar a página, para não piscar */
  try { var t = localStorage.getItem("cp_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Tokens */
:root {
  --bg: #F3F7EC;
  --surface: #FFFFFF;
  --surface-2: #EAF1E0;
  --surface-3: #DDE8D0;
  --ink: #16200F;
  --ink-2: #485641;
  --ink-3: #63725B;
  --line: #D8E3CB;
  --accent: #99AB59;
  --accent-2: #BCCB82;
  --accent-ink: #1C2410;
  --accent-soft: #ECF1DB;
  --accent-text: #4D5C1B;
  --warm: #B86A0C;
  --warm-soft: #FBEEDC;
  --key: #16200F;
  --s-todo: #56624E;
  --s-todo-bg: #E8EEE1;
  --s-doing: #8F5304;
  --s-doing-bg: #FCEBCF;
  --s-done: #17704A;
  --s-done-bg: #DCF3E6;
  --s-rev: #0B6873;
  --s-rev-bg: #D6F0F2;
  --late: #B42B23;
  --late-bg: #FCE3E0;
  --shadow-1: 0 1px 2px rgba(22, 32, 15, 0.06), 0 1px 3px rgba(22, 32, 15, 0.05);
  --shadow-2: 0 4px 14px rgba(22, 32, 15, 0.08), 0 1px 3px rgba(22, 32, 15, 0.06);
  --shadow-3: 0 18px 50px rgba(22, 32, 15, 0.22);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 0px;
  color-scheme: light;
}
/* Tema escuro: segue o sistema, a menos que a pessoa escolha "Claro" ou "Escuro" (data-theme no <html>) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D120B;
    --surface: #161D13;
    --surface-2: #1D2719;
    --surface-3: #273322;
    --ink: #EBF2E5;
    --ink-2: #B2C2A8;
    --ink-3: #93A589;
    --line: #2D3A27;
    --accent: #A3B661;
    --accent-2: #C3D28A;
    --accent-ink: #151B0A;
    --accent-soft: #2A3318;
    --accent-text: #BED07A;
    --warm: #F5A94A;
    --warm-soft: #3A2A14;
    --key: #0D120B;
    --s-todo: #BAC8B0;
    --s-todo-bg: #26311F;
    --s-doing: #F4BA63;
    --s-doing-bg: #3B2C14;
    --s-done: #72D6A4;
    --s-done-bg: #14362A;
    --s-rev: #66D2DD;
    --s-rev-bg: #11363A;
    --late: #FF968D;
    --late-bg: #401C1B;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.35);
    --shadow-3: 0 18px 50px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D120B;
  --surface: #161D13;
  --surface-2: #1D2719;
  --surface-3: #273322;
  --ink: #EBF2E5;
  --ink-2: #B2C2A8;
  --ink-3: #93A589;
  --line: #2D3A27;
  --accent: #A3B661;
  --accent-2: #C3D28A;
  --accent-ink: #151B0A;
  --accent-soft: #2A3318;
  --accent-text: #BED07A;
  --warm: #F5A94A;
  --warm-soft: #3A2A14;
  --key: #0D120B;
  --s-todo: #BAC8B0;
  --s-todo-bg: #26311F;
  --s-doing: #F4BA63;
  --s-doing-bg: #3B2C14;
  --s-done: #72D6A4;
  --s-done-bg: #14362A;
  --s-rev: #66D2DD;
  --s-rev-bg: #11363A;
  --late: #FF968D;
  --late-bg: #401C1B;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 18px 50px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* Base */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--f-body);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(48px + var(--nav-h)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 28px; height: 28px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: var(--r-sm); font-weight: 600; }
.skip:focus { top: 12px; }

/* Cabeçalho */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); padding-top: max(14px, env(safe-area-inset-top, 0px)); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-mark { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); flex: none; color: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-mark { color: var(--accent-ink); } }
:root[data-theme="dark"] .logo-mark { color: var(--accent-ink); }
.headr { display: flex; align-items: center; gap: 8px; }
.theme { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow-1); }
.theme button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; border-radius: 999px; color: var(--ink-3); transition: background 160ms var(--ease), color 160ms var(--ease); }
.theme button:hover { color: var(--ink); }
.theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.logo h1 { font-size: 22px; font-weight: 800; line-height: 1.1; }
.logo small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.who { position: relative; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; box-shadow: var(--shadow-1); min-height: 44px; }
.who select { appearance: none; -webkit-appearance: none; border: 0; background-color: var(--surface); border-radius: 999px; padding: 6px 26px 6px 2px; font-weight: 600; font-size: 15px; max-width: 190px; min-height: 36px; cursor: pointer; }
.who .chev { position: absolute; right: 10px; pointer-events: none; color: var(--ink-3); }
.who { cursor: pointer; font-weight: 600; font-size: 15px; padding-right: 12px; color: var(--ink); }
.who:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.whoname { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 480px) { .whoname { max-width: 90px; } }
.auth { min-height: 60dvh; display: grid; place-items: center; padding: 24px 0; }
.authcard { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 14px; box-shadow: var(--shadow-2); }
.authcard .eic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.authcard h2 { font-size: 26px; font-weight: 800; }
.authcard input { width: 100%; }
input[type="password"] { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; font-size: 16px; min-width: 0; max-width: 100%; }
.stuhead { width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; border-radius: 12px; }
.stuhead:hover h3 { color: var(--accent-text); }
.keychip { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 13px; font-weight: 700; color: var(--accent-text); background: var(--accent-soft); padding: 6px 10px; border-radius: 999px; }
.cred { display: grid; gap: 12px; background: var(--surface-2); border-radius: var(--r-md); padding: 14px; }
.credrow { display: flex; align-items: center; gap: 8px; }
.credrow code { flex: 1; min-width: 0; font: 600 17px/1.3 Consolas, "SF Mono", monospace; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; overflow-wrap: anywhere; }
.atts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.att { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); display: grid; }
.att img, .att video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
.attph { aspect-ratio: 4 / 3; display: grid; place-items: center; align-content: center; gap: 6px; color: var(--ink-3); font-size: 13px; }
.attinfo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 10px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.attinfo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach { cursor: pointer; border-style: dashed; }
.upl { display: grid; gap: 6px; }
.subform { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.pw { position: relative; display: block; }
.pw input { width: 100%; padding-right: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); min-height: 44px; font-size: 16px; }
.pw input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.pw .eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 8px; }
.pw .eye:hover { color: var(--ink); background: var(--surface-2); }
.pw .eye[aria-pressed="true"] { color: var(--accent-text); }
input[type="password"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.role { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); }
.role.stu { background: var(--warm-soft); color: var(--warm); }
/* mini piano do cabeçalho: teclas montadas pelo script para preencher a largura; acende em onda e toca ao clicar */
.keys {
  position: relative; display: flex; height: 38px; max-width: 1180px; margin: 12px auto 0; padding: 4px 4px 0;
  border-radius: 10px 10px 12px 12px; background: linear-gradient(180deg, #2A3320 0%, #12170D 100%);
  box-shadow: 0 6px 18px rgba(18, 23, 13, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.keys::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent)); opacity: .9; }
.wk { position: relative; flex: 1; margin: 0 1px; border-radius: 0 0 6px 6px; cursor: pointer;
  background: linear-gradient(180deg, #F3F5EC 0%, #FFFFFF 55%, #E6EBD8 100%); box-shadow: inset 0 -4px 0 rgba(18, 23, 13, 0.10), inset 0 1px 0 rgba(0, 0, 0, 0.15);
  transform-origin: top; transition: background 420ms var(--ease), transform 120ms var(--ease), box-shadow 420ms var(--ease); }
.bk { position: absolute; top: 4px; height: 58%; border-radius: 0 0 4px 4px; z-index: 2; cursor: pointer;
  background: linear-gradient(180deg, #3A4530 0%, #12170D 70%, #232B1A 100%); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.45), inset 0 -2px 0 rgba(255, 255, 255, 0.10);
  transition: background 420ms var(--ease), transform 120ms var(--ease); }
.wk.on { background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%); box-shadow: inset 0 -2px 0 rgba(18, 23, 13, 0.15), 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transform: scaleY(0.97); transition-duration: 90ms; }
.bk.on { background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%); transform: scaleY(0.96); transition-duration: 90ms; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wk { background: linear-gradient(180deg, #D9DECB 0%, #E9EDE0 55%, #C9D0B8 100%); } }
:root[data-theme="dark"] .wk { background: linear-gradient(180deg, #D9DECB 0%, #E9EDE0 55%, #C9D0B8 100%); }
@media (max-width: 720px) {
  .keys { height: 32px; }
  /* no celular a navegação fica embaixo; o cabeçalho rola junto para não cobrir o conteúdo */
  .top { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; padding-bottom: 4px; }
}
.tabs { display: flex; gap: 6px; max-width: 1180px; margin: 12px auto 0; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background 180ms var(--ease), color 180ms var(--ease); }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="true"] { background: var(--ink); color: var(--bg); }
.tab .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warm); color: #fff; font-size: 12px; display: inline-grid; place-items: center; }

/* Navegação inferior no celular */
.bnav { display: none; }
@media (max-width: 720px) {
  :root { --nav-h: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .tabs { display: none; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bnav button { flex: 1; display: grid; justify-items: center; gap: 2px; background: none; border: 0; min-height: 54px; padding: 4px 2px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
  .bnav button[aria-current="true"] { color: var(--accent-text); }
  .bnav button[aria-current="true"] .pillbg { background: var(--accent-soft); }
  .bnav .pillbg { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background 180ms var(--ease); }
  .bnav .badge { position: absolute; top: 2px; left: calc(50% + 10px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--warm); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .logo small { display: none; }
}

main { padding-top: 22px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; font-weight: 800; }
.ph p { color: var(--ink-2); margin-top: 2px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 0 16px; font-weight: 600; box-shadow: var(--shadow-1); transition: transform 120ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease), box-shadow 180ms var(--ease); }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active { transform: scale(0.97); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.pri:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { color: var(--late); }
.btn.danger.on { background: var(--late); color: #fff; border-color: var(--late); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--ink-2); transition: background 160ms var(--ease); }
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
select, input[type="text"], input[type="url"], input[type="date"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; min-width: 0; max-width: 100%; font-size: 16px;
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
/* a lista aberta do seletor usa estas cores; sem elas fica texto claro em fundo branco no modo escuro */
select option, select optgroup { background-color: var(--surface); color: var(--ink); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { width: 100%; resize: vertical; min-height: 96px; line-height: 1.5; }
.note { color: var(--ink-2); font-size: 14px; }

/* Barra de ferramentas */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.bar .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; min-height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; color: var(--ink-2); transition: background 160ms var(--ease), color 160ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* Resumo */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; box-shadow: var(--shadow-1); min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
.stat .k .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.dot.todo { background: var(--s-todo-bg); color: var(--s-todo); }
.dot.doing { background: var(--s-doing-bg); color: var(--s-doing); }
.dot.done { background: var(--s-done-bg); color: var(--s-done); }
.dot.reviewed { background: var(--s-rev-bg); color: var(--s-rev); }
.dot.late { background: var(--late-bg); color: var(--late); }
.hero { display: flex; align-items: center; gap: 18px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--accent-ink); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 30%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { color: var(--accent-ink); } }
:root[data-theme="dark"] .hero { color: var(--accent-ink); }

  /* ---------- dados (Firebase: login + Firestore) ---------- */
  var FBV = "10.12.2";

  var unsubs = [];

  function loginToEmail(l) { l = String(l || "").trim().toLowerCase(); return l.indexOf("@") > -1 ? l : l + LOGIN_DOMINIO; }
  function validLogin(l) { return /^[a-z0-9._-]{3,30}$/.test(l); }
  function dref(path) { return FB.fs.doc(FB.db, path); }
  function cref(path) { return FB.fs.collection(FB.db, path); }
  function errMsg(e) {
    if (e && e.worker) return e.message.charAt(0).toUpperCase() + e.message.slice(1) + ".";
    var c = (e && e.code) || "";
    if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Usuário ou senha incorretos.";
    if (/too-many-requests/.test(c)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
    if (/email-already-in-use/.test(c)) return "Esse usuário já existe. Escolha outro.";
    if (/weak-password/.test(c)) return "A senha precisa ter pelo menos 6 caracteres.";
    if (/network|unavailable/.test(c)) return "Sem conexão. Verifique a internet e tente de novo.";
    if (/permission-denied/.test(c)) return "Você não tem permissão para fazer isso.";
    return "Algo deu errado. Tente de novo.";

  /* Worker "caderno-admin" (Cloudflare): trocar senha sem saber a antiga, apagar login e guardar anexos no R2.
     Sem o endereço em firebase-config.js, o caderno funciona sem essas funções. */
  var WORKER = String(window.CADERNO_WORKER || "").replace(/\/+$/, "");
  async function callWorker(path, body) {
    var tok = await FB.auth.currentUser.getIdToken();
    var res = await fetch(WORKER + path, { method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw { worker: true, message: data.error || "Falha no servidor" };
    return data;
  }
  async function guard(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { console.error(e); toast(errMsg(e)); return false; }
  }

  async function fbInit() {
    var cfg = window.CADERNO_FIREBASE;
    if (!cfg) { S.screen = "nocfg"; render(); return; }
    var base = "https://www.gstatic.com/firebasejs/" + FBV + "/firebase-";
    var mods = await Promise.all([import(base + "app.js"), import(base + "auth.js"), import(base + "firestore.js")]);
    var app = mods[0].initializeApp(cfg);
    FB = { a: mods[0], au: mods[1], fs: mods[2], app: app, auth: mods[1].getAuth(app), db: mods[2].getFirestore(app) };
    FB.au.onAuthStateChanged(FB.auth, onUser);
  }
  async function readProf() {
    var d = await FB.fs.getDoc(dref("config/professor"));
    S.profExists = d.exists();
    return d.exists() ? d.data() : null;
  }
  async function onUser(user) {
    stopData();
    S.me = null; closeSheet();
    try {
      var prof = await readProf();
      if (!user) { S.screen = S.profExists ? "login" : "first"; render(); return; }
      if (prof && prof.uid === user.uid) {
        S.me = { uid: user.uid, name: prof.name || "Professor", login: prof.login || "", role: "prof" };
      } else {
        var st = await FB.fs.getDoc(dref("students/" + user.uid));
        if (!st.exists()) { S.screen = "noaccess"; render(); return; }
        S.me = { uid: user.uid, name: st.data().name, login: st.data().login || "", role: "aluno" };
      }
      S.screen = "app"; S.tab = pref("tab") || "";
      startData(); render();
    } catch (e) { console.error(e); S.screen = "login"; render(); toast(errMsg(e)); }
  }
  function stopData() { unsubs.forEach(function (u) { u(); }); unsubs = []; D = { modules: [], students: [], tasks: [] }; }
  function listen(q, fn) {
    unsubs.push(FB.fs.onSnapshot(q, fn, function (e) { console.error(e); toast(errMsg(e)); }));
  }
  function docsOf(snap) { return snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; }); }
  function startData() {
    var fs = FB.fs;
    listen(cref("modules"), function (snap) {
      D.modules = docsOf(snap);
      if (isT()) syncModules();
      if (!S.openMod && D.modules.length) S.openMod = modules()[0].id;
      render(); refreshSheet();
    });
    if (isT()) {
      listen(cref("students"), function (snap) { D.students = docsOf(snap); render(); refreshSheet(); });
      listen(cref("tasks"), function (snap) { D.tasks = docsOf(snap); render(); refreshSheet(); });
    } else {
      listen(dref("students/" + S.me.uid), function (d) { D.students = d.exists() ? [Object.assign({ id: d.id }, d.data())] : []; render(); });
      listen(fs.query(cref("tasks"), fs.where("uid", "==", S.me.uid)), function (snap) { D.tasks = docsOf(snap); render(); refreshSheet(); });
    }
  }
  /* professor: cria os módulos da apostila na primeira vez e acrescenta PDFs novos que vierem com o caderno
     (sem trazer de volta os que ele removeu) */
  var syncing = false;
  async function syncModules() {
    if (syncing) return; syncing = true;
    try {
      var b = FB.fs.writeBatch(FB.db), n = 0;
      SEED_MODULES.forEach(function (seed) {
        var cur = modById(seed.id);
        if (!cur) { b.set(dref("modules/" + seed.id), stripId(seed)); n++; return; }
        var have = {}; (cur.materials || []).forEach(function (x) { have[x.id] = true; });
        var gone = cur.removedBuiltins || [];
        var add = builtinMats(seed.id).filter(function (x) { return !have[x.id] && gone.indexOf(x.id) < 0; });
        if (add.length) { b.update(dref("modules/" + seed.id), { materials: add.concat(cur.materials || []) }); n++; }
      });
      if (n) await b.commit();
    } catch (e) { console.error(e); } finally { syncing = false; }
  }
  function stripId(o) { var c = JSON.parse(JSON.stringify(o)); delete c.id; return c; }

  /* login e contas */
  async function doLogin() {
    var l = val("lg-user"), pw = $("lg-pass") ? $("lg-pass").value : "";
    if (!l || !pw) { toast("Preencha usuário e senha."); return; }
    S.busy = true; render();
    try { await FB.au.signInWithEmailAndPassword(FB.auth, loginToEmail(l), pw); S.busy = false; }
    catch (e) {
      S.busy = false; render(); toast(errMsg(e));
      if ($("lg-user")) $("lg-user").value = l;
      var f = $("lg-pass"); if (f) f.focus();
    }
  }
  async function doFirst() {
    var name = val("fp-name"), l = val("fp-user").toLowerCase(), pw = $("fp-pass").value, pw2 = $("fp-pass2").value;
    if (!name) { need("fp-name", "Escreva o seu nome."); return; }
    if (!validLogin(l)) { need("fp-user", "Usuário: de 3 a 30 letras minúsculas, números, ponto, hífen ou _ (sem espaços)."); return; }
    if (pw.length < 6) { need("fp-pass", "A senha precisa ter pelo menos 6 caracteres."); return; }
    if (pw !== pw2) { need("fp-pass2", "As senhas não são iguais."); return; }
    S.busy = true; render();
    try {
      var cred = await FB.au.createUserWithEmailAndPassword(FB.auth, loginToEmail(l), pw);
      await FB.fs.setDoc(dref("config/professor"), { uid: cred.user.uid, name: name, login: l, createdAt: Date.now() });
      S.busy = false;
      await onUser(cred.user);
      toast("Conta do professor criada");
    } catch (e) { console.error(e); S.busy = false; render(); toast(errMsg(e)); }
  }
  async function doLogout() { closeSheet(); await FB.au.signOut(FB.auth); }
  async function changePw() {
    var cur = $("pw-cur").value, nw = $("pw-new").value, nw2 = $("pw-new2").value;
    if (nw.length < 6) { need("pw-new", "A nova senha precisa ter pelo menos 6 caracteres."); return; }
    if (nw !== nw2) { need("pw-new2", "As senhas novas não são iguais."); return; }
    var u = FB.auth.currentUser;
    var ok = await guard(async function () {
      await FB.au.reauthenticateWithCredential(u, FB.au.EmailAuthProvider.credential(u.email, cur));
      await FB.au.updatePassword(u, nw);
    }, "Senha alterada");
    if (ok) closeSheet();

  /* o professor age como o aluno numa instância separada do Firebase (para trocar a senha ou apagar o login),
     usando a senha guardada no cadastro; a própria sessão do professor não é afetada */
  async function asStudent(login, pw, fn) {
    var sec = FB.a.initializeApp(window.CADERNO_FIREBASE, "acesso-" + Date.now());
    try {
      var auth2 = FB.au.getAuth(sec);
      var cred = await FB.au.signInWithEmailAndPassword(auth2, loginToEmail(login), pw);
      await fn(cred.user, auth2);
      if (auth2.currentUser) await FB.au.signOut(auth2);
    } finally { FB.a.deleteApp(sec); }
  }
  async function removeStudent(u) {
    var s = stuById(u); if (!s) return;
    if (WORKER) {
      try { await callWorker("/delete-user", { uid: u }); } catch (e) { console.error(e); toast(errMsg(e)); return; }
    } else if (s.login && s.senha) {
      try { await asStudent(s.login, s.senha, function (user) { return FB.au.deleteUser(user); }); } catch (e) { console.error(e); }
    }
    closeSheet();
    await guard(function () {
      var b = FB.fs.writeBatch(FB.db);
      b.delete(dref("students/" + u));
      D.tasks.filter(function (x) { return x.uid === u; }).forEach(function (x) { b.delete(dref("tasks/" + x.id)); });
      return b.commit();
    }, "Aluno e acesso removidos");
  }
  /* aluno antigo, sem senha guardada: o professor digita a senha que passou e o caderno confere antes de guardar */

  /* anexos das tarefas */
  var MBYTES = 1024 * 1024, fileUrls = {}, loadingUrls = {};
  function fmtSize(b) { return b >= MBYTES ? (b / MBYTES).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
  async function loadUrls(t) {
    var falta = (t.attachments || []).some(function (a) { return !fileUrls[a.key]; });
    if (!falta || loadingUrls[t.id]) return;
    loadingUrls[t.id] = true;
    try { var d = await callWorker("/file-urls", { task: t.id }); Object.assign(fileUrls, d.urls || {}); }
    catch (e) { console.error(e); }
    finally { loadingUrls[t.id] = false; }
    if (S.sheet && S.sheet.type === "task" && S.sheet.id === t.id) paintSheet();
  }
  /* fotos são reduzidas para no máximo 1600 px antes de enviar */
  function shrinkImage(file) {
    return new Promise(function (resolve) {
      if (/gif/.test(file.type)) return resolve(file);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b ? new File([b], (file.name || "foto").replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file); }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  async function uploadAttachment(taskId, file) {
    var isImg = /^image\//.test(file.type), isVid = /^video\//.test(file.type);
    if (!isImg && !isVid) { toast("Escolha um vídeo ou uma foto."); return; }
    if (isImg) file = await shrinkImage(file);
    if (isVid && file.size > 90 * MBYTES) { toast("Vídeo maior que 90 MB. Grave um trecho menor (até uns 2 minutos)."); return; }
    if (isImg && file.size > 15 * MBYTES) { toast("Foto maior que 15 MB."); return; }
    S.upload = { task: taskId, pct: 0 }; paintSheet();
    try {
      var tok = await FB.auth.currentUser.getIdToken();
      await new Promise(function (resolve, reject) {
        var x = new XMLHttpRequest();
        x.open("POST", WORKER + "/upload?task=" + encodeURIComponent(taskId));
        x.setRequestHeader("Authorization", "Bearer " + tok);
        x.setRequestHeader("Content-Type", file.type);
        x.setRequestHeader("X-File-Name", encodeURIComponent(file.name || "anexo"));
        x.upload.onprogress = function (ev) {
          if (!ev.lengthComputable || !S.upload) return;
          S.upload.pct = Math.round(ev.loaded / ev.total * 100);
          var b = $("upbar"), tx = $("uptxt");
          if (b) b.style.width = S.upload.pct + "%"; if (tx) tx.textContent = S.upload.pct + "%";
        };
        x.onload = function () {
          var d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
          if (x.status < 300) resolve(d); else reject({ worker: true, message: d.error || "falha no envio" });
        };
        x.onerror = function () { reject({ code: "network" }); };
        x.send(file);
      });
      toast("Anexo enviado");
    } catch (e) { console.error(e); toast(errMsg(e)); }
    S.upload = null; paintSheet();
  }
  function attsHtml(t, canDel) {
    var atts = t.attachments || [];
    if (!atts.length) return '<p class="note">' + (isT() ? "O aluno ainda não enviou anexos." : "Grave um vídeo ou tire uma foto mostrando a sua prática.") + "</p>";
    loadUrls(t);
    return '<div class="atts">' + atts.map(function (a) {
      var u = fileUrls[a.key], vid = /^video\//.test(a.type);
      var media = !u ? '<div class="attph">' + ic(vid ? "video" : "image", "lg") + "<span>Carregando…</span></div>"
        : vid ? '<video controls playsinline preload="metadata" src="' + esc(u) + '"></video>'

      return '<div class="att">' + media + '<div class="attinfo"><span>' + esc(a.name) + " · " + fmtSize(a.size || 0) + "</span>" +
        (canDel ? '<button class="btn sm danger' + (S.confirm === "a:" + a.key ? " on" : "") + '" data-act="rmAtt" data-k="' + esc(a.key) + '">' + (S.confirm === "a:" + a.key ? "Confirmar" : ic("trash", "sm")) + "</button>" : "") +
        "</div></div>";

  /* o professor cria a conta do aluno numa instância separada do Firebase, para não sair da própria conta */

  var isT = function () { return !!S.me && S.me.role === "prof"; };
  function stuById(u) { for (var i = 0; i < D.students.length; i++) if (D.students[i].id === u) return D.students[i]; return null; }
  function nm(u) { var s = stuById(u); return s ? s.name : "Aluno removido"; }
  function initials(n) { return String(n).trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(""); }
  function hue(u) { var h = 0, s = String(u); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 6; }
  function avImg(u, cls) { return '<span class="av c' + hue(u) + " " + (cls || "") + '" aria-hidden="true">' + esc(initials(nm(u))) + "</span>"; }
  function modules() { return D.modules.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
  function modById(id) { for (var i = 0; i < D.modules.length; i++) if (D.modules[i].id === id) return D.modules[i]; return null; }
  function modName(id) { var m = modById(id); return m ? m.title : ""; }

  function stOf(k) { for (var i = 0; i < ST.length; i++) if (ST[i].k === k) return ST[i]; return ST[0]; }

    if (isT()) return true;

    if (isT()) return D.tasks.filter(function (t) { return stuById(t.uid); });

  }
  function sortT(a, b) {
    var da = a.due || "9999", db_ = b.due || "9999";

  function findTask(id) { for (var i = 0; i < D.tasks.length; i++) if (D.tasks[i].id === id) return D.tasks[i]; return null; }
  function kindOf(url) {

  function listView(list) {

  function row(t) {

      (t.moduleId ? '<span class="tag">' + esc(modName(t.moduleId)) + "</span>" : "") + dueTag(t) +
      '<span class="pill ' + t.status + '">' + ic(st.i, "sm") + st.n + "</span></div></div>" +

  /* alunos */
  function pageStudents() {
    var h = pageHead("Alunos", D.students.length ? D.students.length + (D.students.length > 1 ? " alunos cadastrados" : " aluno cadastrado") : "Cadastre quem faz aula com você.",
      '<button class="btn pri" data-act="addStudent">' + ic("plus") + "Adicionar aluno</button>");

    h += '<div class="grid">' + D.students.map(function (s) {
      var u = s.id, mine = s.moduleIds || [];
      var ts = D.tasks.filter(function (t) { return t.uid === u; });
      var fin = ts.filter(function (t) { return t.status === "done" || t.status === "reviewed"; }).length;
      var rev = ts.filter(function (t) { return t.status === "done"; }).length;
      var late = ts.filter(isLate).length;
      var pct = ts.length ? Math.round(fin / ts.length * 100) : 0;
      return '<div class="panelbox"><button class="stu stuhead" data-act="access" data-u="' + esc(u) + '" aria-label="Ver acesso de ' + esc(s.name) + '">' + avImg(u, "lg") +
        '<span style="min-width:0;flex:1"><h3>' + esc(s.name) + '</h3><span class="note">' + (s.login ? "Usuário: " + esc(s.login) + " · " : "") + fin + " de " + ts.length + " tarefas feitas</span></span>" +
        '<span class="keychip">' + ic("key", "sm") + "Acesso</span></button>" +
        '<div class="prog" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso de ' + esc(s.name) + '"><i style="width:' + pct + '%"></i></div>' +
        ((rev || late) ? '<div class="meta">' + (rev ? '<span class="pill done">' + ic("check", "sm") + rev + " para revisar</span>" : "") + (late ? '<span class="pill late">' + ic("clock", "sm") + late + " atrasada" + (late > 1 ? "s" : "") + "</span>" : "") + "</div>" : "") +
        '<div><div class="lbl" style="margin-bottom:8px">Módulos</div><div class="chips">' +
        modules().map(function (m) {
          var on = mine.indexOf(m.id) > -1;
          return '<button class="chip" data-act="togMod" data-u="' + esc(u) + '" data-m="' + esc(m.id) + '" aria-pressed="' + on + '">' + (on ? ic("check", "sm") : "") + esc(m.title) + "</button>";
        }).join("") + "</div></div>" +
        '<div class="btns"><button class="btn sm danger' + (S.confirm === "s:" + u ? " on" : "") + '" data-act="rmStu" data-u="' + esc(u) + '">' + ic("trash", "sm") + (S.confirm === "s:" + u ? "Confirmar remoção" : "Remover") + "</button>" +
        '<button class="btn sm pri" data-act="newTask" data-u="' + esc(u) + '">' + ic("plus", "sm") + "Nova tarefa</button></div></div>";
    }).join("") + "</div>";
    return h;

  /* módulos e materiais (professor) / materiais (aluno) */
  function topicsHtml(m) {
    var tp = m.topics || [];
    if (!tp.length) return '<p class="note">Nenhum tópico cadastrado.</p>';
    var pdf = {};
    (m.materials || []).forEach(function (x) { if (x.topic) pdf[x.topic] = x; });
    return '<ol class="topics">' + tp.map(function (t) {
      var body = "<b>" + esc(t.t) + "</b>" + (t.d ? "<small>" + esc(t.d) + "</small>" : "");
      var x = pdf[t.t];
      if (!x) return "<li><div>" + body + "</div></li>";
      return '<li class="lk"><a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener"><span>' + body +
        '</span><span class="pdf">' + ic("file", "sm") + "Abrir material</span></a></li>";
    }).join("") + "</ol>";
  }
  function matsHtml(m, edit) {
    var ms = m.materials || [];
    if (!ms.length) return '<p class="note">' + (edit ? "Nenhum material ainda. Adicione vídeos, PDFs ou links de apoio." : "O professor ainda não colocou materiais neste módulo.") + "</p>";
    return '<div class="mats">' + ms.map(function (x) {
      var k = x.kind || "Link";
      return '<div class="mat"><span class="mk">' + ic(KIND_IC[k] || "link") + '</span><a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener noreferrer"><span class="kind">' + esc(k) + "</span>" + esc(x.title) + "</a>" +
        (edit ? '<button class="btn sm danger' + (S.confirm === "x:" + x.id ? " on" : "") + '" data-act="rmMat" data-m="' + esc(m.id) + '" data-x="' + esc(x.id) + '" aria-label="Remover ' + esc(x.title) + '">' + (S.confirm === "x:" + x.id ? "Confirmar" : ic("trash", "sm")) + "</button>" : "") + "</div>";
    }).join("") + "</div>";
  }
  function accordion(m, edit) {
    var open = S.openMod === m.id, mi = modIcon(m);
    var h = '<div class="acc"><button class="h" data-act="openMod" data-m="' + esc(m.id) + '" aria-expanded="' + open + '">' +
      '<span class="mi ' + (mi === "mic" ? "canto" : "") + '">' + ic(mi) + "</span>" +
      '<span class="ht"><strong>' + esc(m.title) + '</strong><span class="note">' + esc(m.summary || "") + "</span></span>" +
      '<span class="cnt">' + (m.topics || []).length + " tópicos</span>" +
      '<span class="chev">' + ic("chevron") + "</span></button>";
    if (open) {
      h += '<div class="body"><div><div class="lbl" style="margin-bottom:10px">Conteúdo da apostila</div>' + topicsHtml(m) + "</div>" +
        '<div><div class="lbl" style="margin-bottom:10px">Materiais</div>' + matsHtml(m, edit) + "</div>";
      if (edit) h += '<div class="btns"><button class="btn sm" data-act="editTopics" data-m="' + esc(m.id) + '">' + ic("pencil", "sm") + 'Editar tópicos</button><button class="btn sm pri" data-act="addMat" data-m="' + esc(m.id) + '">' + ic("plus", "sm") + "Material</button></div>";
      h += "</div>";
    }
    return h + "</div>";
  }
  function pageModules() {
    return pageHead("Apostila", "Tópicos de cada módulo e os materiais de apoio.") + modules().map(function (m) { return accordion(m, true); }).join("");
  }
  function pageMaterials() {
    var s = stuById(S.me.uid), mine = (s && s.moduleIds) || [];
    var ms = modules().filter(function (m) { return mine.indexOf(m.id) > -1; });
    var h = pageHead("Materiais", "O conteúdo dos módulos que você está estudando.");
    if (!ms.length) return h + emptyBig("book", "Nenhum módulo liberado", "Quando o professor liberar o seu módulo, a apostila e os materiais aparecem aqui.");
    return h + ms.map(function (m) { return accordion(m, false); }).join("");

  /* backup */
  function pageBackup() {
    return pageHead("Backup", "Guarde uma cópia dos dados do caderno no seu computador.") +
      '<div class="grid"><div class="panelbox"><div class="stu"><span class="mat" style="border:0;padding:0"><span class="mk">' + ic("shield") + '</span></span><h3>Seus dados ficam na nuvem</h3></div>' +
      '<p class="note">Alunos, tarefas, tópicos e materiais ficam salvos no Firebase e aparecem em qualquer aparelho em que você entrar. Exporte de vez em quando para ter uma cópia extra.</p>' +
      '<div class="btns" style="justify-content:flex-start"><button class="btn pri" data-act="export">' + ic("save", "sm") + "Exportar dados</button></div></div></div>";
  }
  function doExport() {
    var blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "caderno-de-pratica-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Arquivo exportado");
  }

  /* ---------- folhas ---------- */
  var lastFocus = null;
  function openSheet(o) { lastFocus = document.activeElement; S.sheet = o; paintSheet(true); }
  function closeSheet() {
    S.sheet = null; var s = $("sheet"); s.hidden = true; s.innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  /* dados chegaram do servidor: só redesenha a tarefa aberta, e nunca enquanto a pessoa digita */
  function refreshSheet() {
    if (!S.sheet || (S.sheet.type !== "task" && S.sheet.type !== "access")) return;
    var a = document.activeElement;
    if ($("sheet").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (Array.prototype.some.call($("sheet").querySelectorAll("video"), function (v) { return !v.paused; })) return;
    paintSheet();
  }
  function sheetHead(title, pre) {
    return '<div class="grab" aria-hidden="true"></div><div class="hd"><div style="display:grid;gap:8px;min-width:0">' + (pre || "") + '<h2 id="sheetTitle">' + title + '</h2></div><button class="iconbtn" data-act="close" aria-label="Fechar">' + ic("x") + "</button></div>";
  }
  function paintSheet(first) {
    var o = S.sheet, s = $("sheet");
    if (!o) return;
    var h = "";
    if (o.type === "task") h = sheetTask(o);
    else if (o.type === "new") h = sheetNew(o);
    else if (o.type === "addStu") h = sheetAddStu();
    else if (o.type === "topics") h = sheetTopics(o);
    else if (o.type === "mat") h = sheetMat(o);
    else if (o.type === "account") h = sheetAccount();
    else if (o.type === "access") h = sheetAccess(o);
    if (!h) { closeSheet(); return; }
    s.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' + h + "</div>";
    s.hidden = false;
    if (first) {
      var f = s.querySelector("input[type=text]:not([hidden]), input[type=password], textarea");
      if (f && o.type !== "task") f.focus(); else s.querySelector(".iconbtn").focus();
    }
  }
  function sheetTask(o) {
    var t = findTask(o.id);
    if (!t) return "";
    var pre = (t.moduleId || t.due) ? '<div class="meta">' + (t.moduleId ? '<span class="tag">' + esc(modName(t.moduleId)) + "</span>" : "") + dueTag(t) + "</div>" : "";
    var h = sheetHead(esc(t.title), pre);
    if (isT()) h += '<div class="stu">' + avImg(t.uid) + "<span>" + esc(nm(t.uid)) + "</span></div>";
    if (t.note) h += '<div class="field"><span class="lbl">Orientação</span><p class="desc">' + esc(t.note) + "</p></div>";
    h += '<div class="field"><span class="lbl" id="stLbl">Andamento</span><div class="stseg" role="group" aria-labelledby="stLbl">' + ST.map(function (s) {
      var ok = canSet(t, s.k);
      return '<button data-act="setSt" data-k="' + s.k + '" aria-pressed="' + (t.status === s.k) + '"' + (ok ? "" : " disabled") + ">" + ic(s.i, "sm") + s.n + "</button>";
    }).join("") + "</div>" + (!isT() && t.status === "reviewed" ? '<span class="help">Esta tarefa já foi revisada pelo professor.</span>' : "") + "</div>";
    h += attachSection(t);
    if (isT()) {
      h += '<div class="field"><label for="fb">Retorno para o aluno</label><textarea id="fb" placeholder="Ex.: Ótimo! Na próxima, tente com o metrônomo em 70 BPM.">' + esc(t.feedback || "") + "</textarea></div>" +
        '<div class="btns" style="justify-content:space-between"><button class="btn danger' + (S.confirm === "t:" + t.id ? " on" : "") + '" data-act="delTask">' + ic("trash", "sm") + (S.confirm === "t:" + t.id ? "Confirmar exclusão" : "Excluir") + '</button><button class="btn pri" data-act="saveFb">' + ic("check", "sm") + "Salvar retorno</button></div>";
    } else {
      if (t.feedback) h += '<div class="fbbox"><span class="lbl">' + "Retorno do professor</span><p class=\"desc\">" + esc(t.feedback) + "</p></div>";
    }
    return h;
  }
  function stuChecks(modId, pre) {

      var on = pre ? pre === s.id : (modId && (s.moduleIds || []).indexOf(modId) > -1);
      return '<label><input type="checkbox" name="nt-stu" value="' + esc(s.id) + '"' + (on ? " checked" : "") + "> " + avImg(s.id) + esc(s.name) + "</label>";
    }).join("");

      } else if (mode === "login") {
        h += '<div class="subform"><div class="field"><label for="ac-newlogin">Novo usuário</label><input type="text" id="ac-newlogin" value="' + esc(s.login) + '" autocomplete="off" autocapitalize="none" spellcheck="false">' +
          '<span class="help">As tarefas do aluno continuam com ele. O usuário antigo deixa de funcionar.</span></div>' +
          '<div class="btns"><button class="btn ghost" data-act="acMode" data-k="">Cancelar</button><button class="btn pri" data-act="acSaveLogin">' + ic("check", "sm") + "Salvar usuário</button></div></div>";
      } else {
        h += '<div class="two"><button class="btn" data-act="acMode" data-k="pw">' + ic("key", "sm") + (s.senha ? "Trocar senha" : "Definir senha nova") + "</button>" +
          (s.senha ? '<button class="btn" data-act="acMode" data-k="login">' + ic("user", "sm") + "Trocar usuário</button>" : "") + "</div>";
      }
    }
    h += '<div class="btns" style="justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px">' +
      '<span class="note">Remove o aluno, as tarefas e o login.</span><button class="btn danger' + (S.confirm === "s:" + s.id ? " on" : "") + '" data-act="rmStu" data-u="' + esc(s.id) + '">' + ic("trash", "sm") + (S.confirm === "s:" + s.id ? "Confirmar remoção" : "Remover acesso") + "</button></div>";
    return h;
  }
  function sheetTopics(o) {
    var m = modById(o.m); if (!m) return "";
    var txt = (m.topics || []).map(function (t) { return t.t + (t.d ? " | " + t.d : ""); }).join("\n");
    return sheetHead("Tópicos de " + esc(m.title)) +
      '<div class="field"><label for="tp-txt">Tópicos</label><textarea id="tp-txt" style="min-height:280px">' + esc(txt) + '</textarea><span class="help">Um tópico por linha. Para incluir uma explicação, escreva “Título | explicação”.</span></div>' +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="saveTopics">' + ic("check", "sm") + "Salvar</button></div>";
  }
  function sheetMat(o) {
    var m = modById(o.m); if (!m) return "";
    return sheetHead("Novo material", '<span class="tag">' + esc(m.title) + "</span>") +
      '<div class="field"><label for="mt-title">Nome do material *</label><input type="text" id="mt-title" placeholder="Ex.: Escalas maiores (PDF)"></div>' +
      '<div class="field"><label for="mt-url">Link *</label><input type="url" id="mt-url" placeholder="https://" inputmode="url"><span class="help">YouTube, Google Drive, site… Para PDFs e áudios, suba o arquivo no Drive e cole o link de compartilhamento.</span></div>' +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="saveMat">' + ic("plus", "sm") + "Adicionar</button></div>";
  }

  /* ---------- ações ---------- */
  /* campo de senha com o botão de olho para mostrar ou esconder o que foi digitado */
  function pwField(id, ac) {
    return '<span class="pw"><input type="password" id="' + id + '" autocomplete="' + ac + '" autocapitalize="none" spellcheck="false">' +
      '<button type="button" class="eye" data-act="togglePw" data-id="' + id + '" aria-label="Mostrar senha" aria-pressed="false">' + ic("eye") + "</button></span>";
  }
  function togglePw(btn) {
    var inp = $(btn.dataset.id); if (!inp) return;
    var show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", String(show));
    btn.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
    btn.innerHTML = ic(show ? "eyeOff" : "eye");
    inp.focus();
  }
  function val(id) { var e = $(id); return e ? e.value.trim() : ""; }
  function checked(name) { return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; }); }
  function need(id, msg) { toast(msg); var e = $(id); if (e) e.focus(); }

  async function createTasks() {
    var title = val("nt-title"), us = checked("nt-stu");
    if (!title) { need("nt-title", "Escreva o título da tarefa."); return; }
    if (!us.length) { toast("Escolha pelo menos um aluno."); return; }
    var base = { title: title, note: val("nt-note"), moduleId: val("nt-mod") || null, due: val("nt-due") || null, status: "todo", feedback: "", createdAt: Date.now(), doneAt: null };
    var btn = document.querySelector('[data-act="createTask"]'); if (btn) btn.disabled = true;
    var ok = await guard(function () {
      var b = FB.fs.writeBatch(FB.db);
      us.forEach(function (u) { b.set(FB.fs.doc(cref("tasks")), Object.assign({ uid: u }, base)); });
      return b.commit();
    }, "Tarefa enviada para " + us.length + (us.length > 1 ? " alunos" : " aluno"));
    if (ok) closeSheet(); else if (btn) btn.disabled = false;
  }
  async function saveStudent() {
    var name = val("as-name"), login = val("as-user").toLowerCase(), pw = val("as-pass");
    if (!name) { need("as-name", "Escreva o nome do aluno."); return; }
    if (!validLogin(login)) { need("as-user", "Usuário: de 3 a 30 letras minúsculas, números, ponto, hífen ou _ (sem espaços)."); return; }
    if (pw.length < 6) { need("as-pass", "A senha precisa ter pelo menos 6 caracteres."); return; }
    var btn = document.querySelector('[data-act="saveStudent"]'); if (btn) { btn.disabled = true; btn.textContent = "Criando…"; }
    var mods = checked("as-mod");
    var ok = await guard(async function () {
      var uid = await createStudentAccount(login, pw);
      await FB.fs.setDoc(dref("students/" + uid), { name: name, login: login, senha: pw, moduleIds: mods, createdAt: Date.now() });
    }, "Aluno adicionado. Usuário: " + login);
    if (ok) closeSheet(); else if (btn) { btn.disabled = false; btn.textContent = "Adicionar"; }
  }
  async function saveMat() {
    var m = modById(S.sheet.m), title = val("mt-title"), url = val("mt-url");
    if (!title) { need("mt-title", "Dê um nome ao material."); return; }
    if (!/^https?:\/\//.test(url)) { need("mt-url", "Cole um link que comece com https://"); return; }
    var mats = (m.materials || []).concat([{ id: rid(), title: title, url: url, kind: kindOf(url) }]);
    if (await guard(function () { return FB.fs.updateDoc(dref("modules/" + m.id), { materials: mats }); }, "Material adicionado")) closeSheet();
  }
  async function saveTopics() {
    var m = modById(S.sheet.m);
    var topics = ($("tp-txt").value || "").split("\n").map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var i = l.indexOf("|");
      return i > -1 ? { t: l.slice(0, i).trim(), d: l.slice(i + 1).trim() } : { t: l, d: "" };
    });
    if (await guard(function () { return FB.fs.updateDoc(dref("modules/" + m.id), { topics: topics }); }, "Tópicos salvos")) closeSheet();
  }
  function onModChange() {
    var mid = $("nt-mod").value, m = modById(mid);
    $("nt-top").innerHTML = m && (m.topics || []).length
      ? '<option value="">Escolha um tópico</option>' + m.topics.map(function (t, i) { return '<option value="' + i + '">' + esc(t.t) + "</option>"; }).join("")
      : '<option value="">Escolha o módulo</option>';
    $("nt-stus").innerHTML = stuChecks(mid, null);
  }
  function onTopChange() {
    var m = modById($("nt-mod").value), i = $("nt-top").value;
    if (!m || i === "") return;
    $("nt-title").value = "Praticar: " + m.topics[+i].t;
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) { if (e.target.id === "sheet") closeSheet(); return; }
    var a = el.dataset.act, u = el.dataset.u, id = el.dataset.id, m = el.dataset.m;
    if (a !== "delTask" && a !== "rmMat" && a !== "rmStu" && a !== "rmAtt" && a !== "peek" && a !== "copy" && S.confirm) S.confirm = "";
    if (a === "tab") { S.tab = el.dataset.k; pref("tab", S.tab); render(); window.scrollTo(0, 0); $("main").focus({ preventScroll: true }); }
    else if (a === "view") { S.view = el.dataset.k; pref("view", S.view); render(); }
    else if (a === "open") openSheet({ type: "task", id: id });
    else if (a === "adv") { e.stopPropagation(); var t = findTask(id), n = t && nextOf(t); if (n) setStatus(id, n.k); }
    else if (a === "toggle") { e.stopPropagation(); var t2 = findTask(id); if (t2) setStatus(id, t2.status === "done" ? "todo" : "done"); }
    else if (a === "setSt") setStatus(S.sheet.id, el.dataset.k);
    else if (a === "close") closeSheet();
    else if (a === "newTask") openSheet({ type: "new", u: u || null });
    else if (a === "addStudent") openSheet({ type: "addStu" });
    else if (a === "saveStudent") saveStudent();
    else if (a === "togMod") {
      var s = stuById(u), cur = (s.moduleIds || []).slice(), i = cur.indexOf(m);
      if (i > -1) cur.splice(i, 1); else cur.push(m);
      guard(function () { return FB.fs.updateDoc(dref("students/" + u), { moduleIds: cur }); });
    }
    else if (a === "rmStu") {
      if (S.confirm === "s:" + u) {
        S.confirm = "";
        if (S.fStu === u) S.fStu = "";
        removeStudent(u);
      } else { S.confirm = "s:" + u; render(); if (S.sheet && S.sheet.type === "access") paintSheet(); }
    }
    else if (a === "openMod") { S.openMod = S.openMod === m ? "" : m; render(); }
    else if (a === "editTopics") openSheet({ type: "topics", m: m });
    else if (a === "addMat") openSheet({ type: "mat", m: m });
    else if (a === "rmMat") {
      var x = el.dataset.x;
      if (S.confirm === "x:" + x) {
        S.confirm = ""; var mod = modById(m), patch = { materials: (mod.materials || []).filter(function (q) { return q.id !== x; }) };
        if (/^pdf-/.test(x)) patch.removedBuiltins = (mod.removedBuiltins || []).concat([x]);
        guard(function () { return FB.fs.updateDoc(dref("modules/" + m), patch); }, "Material removido");
      } else { S.confirm = "x:" + x; render(); }
    }
    else if (a === "createTask") createTasks();
    else if (a === "saveMat") saveMat();
    else if (a === "saveTopics") saveTopics();
    else if (a === "saveFb") { var fbTxt = val("fb"), fbId = S.sheet.id; guard(function () { return FB.fs.updateDoc(dref("tasks/" + fbId), { feedback: fbTxt }); }, "Retorno salvo"); }
    else if (a === "delTask") {
      var tid = S.sheet.id;
      if (S.confirm === "t:" + tid) {
        S.confirm = ""; closeSheet();
        var tAtt = findTask(tid);
        guard(async function () {
          if (WORKER && tAtt && (tAtt.attachments || []).length) await callWorker("/delete-task-files", { task: tid });
          await FB.fs.deleteDoc(dref("tasks/" + tid));
        }, "Tarefa excluída");
      } else { S.confirm = "t:" + tid; paintSheet(); }
    }
    else if (a === "theme") setTheme(el.dataset.k);
    else if (a === "togglePw") togglePw(el);
    else if (a === "access") openSheet({ type: "access", u: u, mode: "" });
    else if (a === "rmAtt") {
      var ak = el.dataset.k, at = S.sheet.id;
      if (S.confirm === "a:" + ak) { S.confirm = ""; guard(function () { return callWorker("/delete-file", { task: at, key: ak }); }, "Anexo apagado"); }
      else { S.confirm = "a:" + ak; paintSheet(); }
    }
    else if (a === "acMode") { S.sheet.mode = el.dataset.k; paintSheet(); var f = $("ac-newpw") || $("ac-newlogin"); if (f) f.focus(); }
    else if (a === "acSavePw") changeStudentPw(S.sheet.u);
    else if (a === "acSaveLogin") changeStudentLogin(S.sheet.u);
    else if (a === "acRegPw") registerStudentPw(S.sheet.u);
    else if (a === "peek") {
      var c = $("ac-pw"), show = el.getAttribute("aria-pressed") !== "true";
      c.textContent = show ? c.dataset.pw : "••••••••"; el.setAttribute("aria-pressed", String(show));
      el.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); el.innerHTML = ic(show ? "eyeOff" : "eye");
    }
    else if (a === "copy") {
      var st = stuById(S.sheet.u), t = el.dataset.t;
      copyText(t === "login" ? st.login : t === "senha" ? st.senha : accessText(st), t === "tudo" ? "Acesso copiado. É só colar no WhatsApp." : "Copiado");
    }
    else if (a === "export") doExport();
    else if (a === "account") openSheet({ type: "account" });
    else if (a === "logout") doLogout();
  });
  document.addEventListener("change", function (e) {
    var k = e.target.dataset && e.target.dataset.chg;
    if (k === "attach") { var f = e.target.files && e.target.files[0]; e.target.value = ""; if (f && S.sheet) uploadAttachment(S.sheet.id, f); return; }
    if (k === "fStu") { S.fStu = e.target.value; render(); }
    else if (k === "fMod") { S.fMod = e.target.value; render(); }
    else if (k === "ntMod") onModChange();
    else if (k === "ntTop") onTopChange();
  });
  document.addEventListener("submit", function (e) {
    var f = e.target.dataset && e.target.dataset.form; if (!f) return;
    e.preventDefault();
    if (S.busy) return;
    if (f === "login") doLogin(); else if (f === "first") doFirst(); else if (f === "pw") changePw();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.sheet) closeSheet();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[data-act="open"]')) { e.preventDefault(); e.target.click(); }
  });
  /* arrastar e soltar (computador e iPad) */
  var drag = null;
  document.addEventListener("dragstart", function (e) {
    var c = e.target.closest && e.target.closest(".card"); if (!c) return;
    drag = c.dataset.id;
    try { e.dataTransfer.setData("text/plain", drag); e.dataTransfer.effectAllowed = "move"; } catch (er) {}
  });
  document.addEventListener("dragover", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (!c || !drag) return;
    e.preventDefault(); c.classList.add("over");
  });
  document.addEventListener("dragleave", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (c) c.classList.remove("over");
  });
  document.addEventListener("drop", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (!c || !drag) return;
    e.preventDefault(); c.classList.remove("over");
    var d = drag; drag = null; setStatus(d, c.dataset.drop);
  });
  document.addEventListener("dragend", function () { drag = null; });

  /* ---------- início ---------- */
  /* ---------- mini piano do cabeçalho ---------- */
  var calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  var audio = null, pianoW = 0;
  function buildPiano() {
    var el = $("piano"); if (!el) return;
    var w = el.clientWidth || 600;
    if (w === pianoW) return; pianoW = w;
    var n = Math.max(14, Math.round(w / 24));
    var claras = [0, 2, 4, 5, 7, 9, 11], pretaDepois = { 0: 1, 1: 3, 3: 6, 4: 8, 5: 10 };
    var h = "";
    for (var i = 0; i < n; i++) h += '<span class="wk" data-i="' + i + '" data-midi="' + (48 + 12 * Math.floor(i / 7) + claras[i % 7]) + '"></span>';
    for (var j = 0; j < n - 1; j++) {
      if (!((j % 7) in pretaDepois)) continue;
      h += '<span class="bk" data-midi="' + (48 + 12 * Math.floor(j / 7) + pretaDepois[j % 7]) + '" style="width:var(--bw);left:calc(4px + (100% - 8px) * ' + ((j + 1) / n).toFixed(5) + ' - var(--bw) / 2)"></span>';
    }
    el.style.setProperty("--bw", ((w - 8) / n * 0.58).toFixed(1) + "px");
    el.innerHTML = h;
  }
  function light(k, ms) { if (!k) return; k.classList.add("on"); setTimeout(function () { k.classList.remove("on"); }, ms || 260); }
  function whites() { return document.querySelectorAll("#piano .wk"); }
  /* onda verde da esquerda para a direita */
  function pianoWave() {
    if (calm) return;
    Array.prototype.forEach.call(whites(), function (k, i) { setTimeout(function () { light(k, 240); }, i * 28); });
  }
  /* de vez em quando um acorde (Dó, Fá ou Sol maior) acende em arpejo, numa oitava sorteada */
  function pianoChord() {
    if (calm || document.hidden) return;
    var ws = whites(), oit = Math.floor(ws.length / 7); if (!oit) return;
    var base = 7 * Math.floor(Math.random() * oit) + [0, 3, 4][Math.floor(Math.random() * 3)];
    [0, 2, 4, 7].forEach(function (d, k) { setTimeout(function () { light(ws[base + d], 520); }, k * 130); });
  }
  /* tocar uma tecla: acende e faz um som curto, parecido com piano */
  function tone(midi) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var t = audio.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12), g = audio.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      g.connect(audio.destination);
      [[1, "triangle", 1], [2, "sine", 0.35]].forEach(function (p) {
        var o = audio.createOscillator(), og = audio.createGain();
        o.type = p[1]; o.frequency.value = f * p[0]; og.gain.value = p[2];
        o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.5);
      });
    } catch (e) {}
  }
  document.addEventListener("pointerdown", function (e) {
    var k = e.target.closest && e.target.closest("#piano .wk, #piano .bk"); if (!k) return;
    light(k, 300); tone(+k.dataset.midi);
  });
  var pianoT;
  window.addEventListener("resize", function () { clearTimeout(pianoT); pianoT = setTimeout(buildPiano, 150); });

  $("logoMark").innerHTML = ic("music");
  buildPiano();
  setTimeout(pianoWave, 400);
  setInterval(pianoChord, 6500);
  paintTheme();
  S.view = pref("view") === "lista" ? "lista" : "quadro";
  render();
  fbInit().catch(function (e) { console.error(e); S.screen = "nocfg"; render(); toast("Não foi possível carregar o login. Verifique a internet."); });
})();
</script>
</body>
</html>

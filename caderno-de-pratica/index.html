<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D120B" media="(prefers-color-scheme: dark)">
<title>Caderno de Prática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Tokens */
:root {
  --bg: #F3F7EC;
  --surface: #FFFFFF;
  --surface-2: #EAF1E0;
  --surface-3: #DDE8D0;
  --ink: #16200F;
  --ink-2: #485641;
  --ink-3: #63725B;
  --line: #D8E3CB;
  --accent: #426A23;
  --accent-2: #7DB04A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F0D3;
  --warm: #B86A0C;
  --warm-soft: #FBEEDC;
  --key: #16200F;
  --s-todo: #56624E;
  --s-todo-bg: #E8EEE1;
  --s-doing: #8F5304;
  --s-doing-bg: #FCEBCF;
  --s-done: #17704A;
  --s-done-bg: #DCF3E6;
  --s-rev: #0B6873;
  --s-rev-bg: #D6F0F2;
  --late: #B42B23;
  --late-bg: #FCE3E0;
  --shadow-1: 0 1px 2px rgba(22, 32, 15, 0.06), 0 1px 3px rgba(22, 32, 15, 0.05);
  --shadow-2: 0 4px 14px rgba(22, 32, 15, 0.08), 0 1px 3px rgba(22, 32, 15, 0.06);
  --shadow-3: 0 18px 50px rgba(22, 32, 15, 0.22);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D120B;
    --surface: #161D13;
    --surface-2: #1D2719;
    --surface-3: #273322;
    --ink: #EBF2E5;
    --ink-2: #B2C2A8;
    --ink-3: #93A589;
    --line: #2D3A27;
    --accent: #A9D67E;
    --accent-2: #C8E6A0;
    --accent-ink: #12200A;
    --accent-soft: #283A1C;
    --warm: #F5A94A;
    --warm-soft: #3A2A14;
    --key: #0D120B;
    --s-todo: #BAC8B0;
    --s-todo-bg: #26311F;
    --s-doing: #F4BA63;
    --s-doing-bg: #3B2C14;
    --s-done: #72D6A4;
    --s-done-bg: #14362A;
    --s-rev: #66D2DD;
    --s-rev-bg: #11363A;
    --late: #FF968D;
    --late-bg: #401C1B;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.35);
    --shadow-3: 0 18px 50px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

/* Base */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--f-body);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(48px + var(--nav-h)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 28px; height: 28px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: var(--r-sm); font-weight: 600; }
.skip:focus { top: 12px; }

/* Cabeçalho */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); padding-top: max(14px, env(safe-area-inset-top, 0px)); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-mark { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); flex: none; }
@media (prefers-color-scheme: dark) { .logo-mark { color: var(--accent-ink); } }
.logo h1 { font-size: 22px; font-weight: 800; line-height: 1.1; }
.logo small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.who { position: relative; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 4px; box-shadow: var(--shadow-1); min-height: 44px; }
.who select { appearance: none; -webkit-appearance: none; border: 0; background-color: var(--surface); border-radius: 999px; padding: 6px 26px 6px 2px; font-weight: 600; font-size: 15px; max-width: 190px; min-height: 36px; cursor: pointer; }
.who .chev { position: absolute; right: 10px; pointer-events: none; color: var(--ink-3); }
.role { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.role.stu { background: var(--warm-soft); color: var(--warm); }
.keys {
  height: 10px; margin: 12px auto 0; max-width: 1180px; border-radius: 3px 3px 6px 6px; border: 1px solid var(--line); opacity: 0.85;
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent 12px, var(--key) 12px, var(--key) 24px, transparent 24px),
    linear-gradient(90deg, transparent 30px, var(--key) 30px, var(--key) 42px, transparent 42px),
    linear-gradient(90deg, transparent 66px, var(--key) 66px, var(--key) 78px, transparent 78px),
    linear-gradient(90deg, transparent 84px, var(--key) 84px, var(--key) 96px, transparent 96px),
    linear-gradient(90deg, transparent 102px, var(--key) 102px, var(--key) 114px, transparent 114px),
    repeating-linear-gradient(90deg, transparent 0 17px, var(--line) 17px 18px);
  background-size: 126px 6px, 126px 6px, 126px 6px, 126px 6px, 126px 6px, auto;
  background-repeat: repeat-x, repeat-x, repeat-x, repeat-x, repeat-x, repeat;
}
.tabs { display: flex; gap: 6px; max-width: 1180px; margin: 12px auto 0; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background 180ms var(--ease), color 180ms var(--ease); }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="true"] { background: var(--ink); color: var(--bg); }
.tab .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warm); color: #fff; font-size: 12px; display: inline-grid; place-items: center; }

/* Navegação inferior no celular */
.bnav { display: none; }
@media (max-width: 720px) {
  :root { --nav-h: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .tabs { display: none; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bnav button { flex: 1; display: grid; justify-items: center; gap: 2px; background: none; border: 0; min-height: 54px; padding: 4px 2px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
  .bnav button[aria-current="true"] { color: var(--accent); }
  .bnav button[aria-current="true"] .pillbg { background: var(--accent-soft); }
  .bnav .pillbg { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background 180ms var(--ease); }
  .bnav .badge { position: absolute; top: 2px; left: calc(50% + 10px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--warm); color: #fff; font-size: 11px; display: grid; place-items: center; }
  .logo small { display: none; }
}

main { padding-top: 22px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; font-weight: 800; }
.ph p { color: var(--ink-2); margin-top: 2px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 0 16px; font-weight: 600; box-shadow: var(--shadow-1); transition: transform 120ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease), box-shadow 180ms var(--ease); }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active { transform: scale(0.97); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.pri:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { color: var(--late); }
.btn.danger.on { background: var(--late); color: #fff; border-color: var(--late); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--ink-2); transition: background 160ms var(--ease); }
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
select, input[type="text"], input[type="url"], input[type="date"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; min-width: 0; max-width: 100%; font-size: 16px;
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
/* a lista aberta do seletor usa estas cores; sem elas fica texto claro em fundo branco no modo escuro */
select option, select optgroup { background-color: var(--surface); color: var(--ink); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { width: 100%; resize: vertical; min-height: 96px; line-height: 1.5; }
.note { color: var(--ink-2); font-size: 14px; }

/* Barra de ferramentas */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.bar .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; min-height: 36px; padding: 0 14px; border-radius: 9px; font-weight: 600; color: var(--ink-2); transition: background 160ms var(--ease), color 160ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* Resumo */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; box-shadow: var(--shadow-1); min-width: 0; }
.stat .k { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
.stat .k .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.dot.todo { background: var(--s-todo-bg); color: var(--s-todo); }
.dot.doing { background: var(--s-doing-bg); color: var(--s-doing); }
.dot.done { background: var(--s-done-bg); color: var(--s-done); }
.dot.reviewed { background: var(--s-rev-bg); color: var(--s-rev); }
.dot.late { background: var(--late-bg); color: var(--late); }
.hero { display: flex; align-items: center; gap: 18px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 30%, transparent); }
@media (prefers-color-scheme: dark) { .hero { color: var(--accent-ink); } }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(currentColor calc(var(--p) * 1%), color-mix(in srgb, currentColor 25%, transparent) 0); }
.ring span { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; background: color-mix(in srgb, var(--accent) 85%, var(--accent-2)); }
.hero h3 { font-size: 20px; font-weight: 800; }
.hero p { opacity: 0.9; font-size: 15px; }
.hero .late-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }

/* Etiquetas */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--s-todo-bg); color: var(--s-todo); white-space: nowrap; }
.pill.doing { background: var(--s-doing-bg); color: var(--s-doing); }
.pill.done { background: var(--s-done-bg); color: var(--s-done); }
.pill.reviewed { background: var(--s-rev-bg); color: var(--s-rev); }
.pill.late { background: var(--late-bg); color: var(--late); }
.tag { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; padding: 3px 9px; border-radius: 7px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* Quadro */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; }
@media (max-width: 720px) { .board { grid-auto-columns: 84%; margin: 0 -16px; padding: 0 16px 10px; scroll-padding: 0 16px; } }
.col { background: var(--surface-2); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; scroll-snap-align: start; min-width: 0; transition: outline-color 160ms var(--ease); outline: 2px dashed transparent; outline-offset: -2px; }
.col.over { outline-color: var(--accent); }
.col > header { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.col > header .sd { width: 10px; height: 10px; border-radius: 50%; }
.col > header b { margin-left: auto; font: 600 13px var(--f-body); color: var(--ink-2); background: var(--surface); padding: 2px 9px; border-radius: 999px; }
.sd.todo { background: var(--s-todo); } .sd.doing { background: var(--s-doing); } .sd.done { background: var(--s-done); } .sd.reviewed { background: var(--s-rev); }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 14px 14px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; box-shadow: var(--shadow-1); transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms var(--ease); overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--s-todo); }
.card.doing::before { background: var(--s-doing); } .card.done::before { background: var(--s-done); } .card.reviewed::before { background: var(--s-rev); }
.card.late::before { background: var(--late); }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card:active { transform: scale(0.99); }
.card h4 { font: 600 16px/1.35 var(--f-body); letter-spacing: 0; overflow-wrap: anywhere; }
.card .fb { display: flex; gap: 6px; align-items: flex-start; color: var(--ink-2); font-size: 13px; }
.card .fb span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stu { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; font-weight: 500; }
.stu span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.av.lg { width: 44px; height: 44px; font-size: 16px; }
.av.c0 { background: #4C7A2A; } .av.c1 { background: #C2410C; } .av.c2 { background: #0F766E; } .av.c3 { background: #7C3AED; } .av.c4 { background: #BE185D; } .av.c5 { background: #4D7C0F; }
.empty { color: var(--ink-3); font-size: 14px; padding: 18px 8px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r-md); }
.emptybig { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 36px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.emptybig .eic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 4px; }
.emptybig h3 { font-size: 20px; }
.emptybig p { max-width: 420px; }

/* Lista */
.lsec { margin-bottom: 22px; }
.lsec h3 { display: flex; align-items: center; gap: 8px; font: 600 14px var(--f-body); color: var(--ink-2); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.row { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px 10px 10px; margin-bottom: 8px; cursor: pointer; min-width: 0; box-shadow: var(--shadow-1); transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease); }
.row:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); box-shadow: var(--shadow-2); }
.row .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
.row .grow b { font-weight: 600; overflow-wrap: anywhere; }
.row .go { color: var(--ink-3); }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; flex: none; padding: 0; }
.chk i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; transition: background 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease); }
.chk:hover i { border-color: var(--s-done); }
.chk.on i { background: var(--s-done); border-color: var(--s-done); color: #fff; }
.chk.lock i { background: var(--s-rev); border-color: var(--s-rev); color: #fff; }
.chk.lock { cursor: default; }

/* Alunos */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.panelbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow-1); }
.panelbox h3 { font-size: 18px; }
.prog { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--s-done), color-mix(in srgb, var(--s-done) 70%, var(--s-rev))); transition: width 300ms var(--ease); }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 12px; font-size: 14px; font-weight: 500; transition: background 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease); }
.chip:hover { border-color: var(--accent); }

  function stuById(u) { for (var i = 0; i < D.students.length; i++) if (D.students[i].id === u) return D.students[i]; return null; }
  function nm(u) { var s = stuById(u); return s ? s.name : "Aluno removido"; }
  function initials(n) { return String(n).trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join(""); }
  function hue(u) { var h = 0, s = String(u); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 6; }
  function avImg(u, cls) { return '<span class="av c' + hue(u) + " " + (cls || "") + '" aria-hidden="true">' + esc(initials(nm(u))) + "</span>"; }
  function modules() { return D.modules.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
  function modById(id) { for (var i = 0; i < D.modules.length; i++) if (D.modules[i].id === id) return D.modules[i]; return null; }
  function modName(id) { var m = modById(id); return m ? m.title : ""; }
  function modIcon(m) { return /canto/i.test(m.id + " " + m.title) ? "mic" : "piano"; }
  function stOf(k) { for (var i = 0; i < ST.length; i++) if (ST[i].k === k) return ST[i]; return ST[0]; }
  function canSet(t, k) {
    if (isT()) return true;
    return t.status !== "reviewed" && k !== "reviewed";
  }
  function allTasks() {
    if (isT()) return D.tasks.filter(function (t) { return stuById(t.uid); });
    return D.tasks.filter(function (t) { return t.uid === S.who; });
  }
  function sortT(a, b) {
    var da = a.due || "9999", db_ = b.due || "9999";
    return da < db_ ? -1 : da > db_ ? 1 : (a.createdAt || 0) - (b.createdAt || 0);
  }
  function isLate(t) { return t.due && t.due < todayStr() && (t.status === "todo" || t.status === "doing"); }
  function findTask(id) { for (var i = 0; i < D.tasks.length; i++) if (D.tasks[i].id === id) return D.tasks[i]; return null; }
  function kindOf(url) {
    var s = (url || "").toLowerCase();
    if (/youtu\.?be|vimeo/.test(s)) return "Vídeo";
    if (/\.pdf($|\?)/.test(s)) return "PDF";
    if (/\.(mp3|m4a|wav|ogg)($|\?)/.test(s)) return "Áudio";
    if (/\.(png|jpe?g|gif|webp)($|\?)/.test(s)) return "Imagem";
    return "Link";
  }
  var KIND_IC = { "Vídeo": "video", "PDF": "file", "Áudio": "music", "Imagem": "image", "Link": "link" };
  function pendingReview() { return D.tasks.filter(function (t) { return t.status === "done" && stuById(t.uid); }).length; }

  function setStatus(id, k) {
    var t = findTask(id);
    if (!t || t.status === k || !canSet(t, k)) return;
    t.status = k;
    t.doneAt = (k === "done" || k === "reviewed") ? (t.doneAt || Date.now()) : null;
    save(); render(); if (S.sheet && S.sheet.type === "task") paintSheet();
    if (k === "done" && !isT()) toast("Boa! Tarefa marcada como feita");
  }
  function nextOf(t) {
    if (t.status === "todo") return { k: "doing", n: "Comecei a praticar", i: "play" };
    if (t.status === "doing") return { k: "done", n: "Marcar como feita", i: "check" };
    if (t.status === "done" && isT()) return { k: "reviewed", n: "Marcar como revisada", i: "badge" };
    return null;
  }

  /* ---------- telas ---------- */
  function tabsFor() {
    return isT()
      ? [{ k: "tarefas", n: "Tarefas", i: "tasks", b: pendingReview() }, { k: "alunos", n: "Alunos", i: "users" }, { k: "modulos", n: "Apostila", i: "book" }, { k: "backup", n: "Backup", i: "save" }]
      : [{ k: "tarefas", n: "Minhas tarefas", i: "tasks" }, { k: "materiais", n: "Materiais", i: "book" }];
  }
  function render() {
    if (S.who !== "prof" && !stuById(S.who)) S.who = "prof";
    $("me").innerHTML = '<label class="who"><span class="role' + (isT() ? "" : " stu") + '">' + (isT() ? "Professor" : "Aluno") + "</span>" +
      '<span class="sr">Quem está usando</span><select data-chg="who"><option value="prof"' + (isT() ? " selected" : "") + ">Professor</option>" +
      D.students.map(function (s) { return '<option value="' + esc(s.id) + '"' + (S.who === s.id ? " selected" : "") + ">" + esc(s.name) + "</option>"; }).join("") + "</select>" +
      '<span class="chev">' + ic("chevron", "sm") + "</span></label>";
    var tabs = tabsFor();
    if (!tabs.some(function (t) { return t.k === S.tab; })) S.tab = tabs[0].k;
    $("tabs").innerHTML = tabs.map(function (t) {
      return '<button class="tab" data-act="tab" data-k="' + t.k + '" aria-current="' + (S.tab === t.k) + '">' + ic(t.i) + t.n +
        (t.b ? '<span class="badge" aria-label="' + t.b + ' para revisar">' + t.b + "</span>" : "") + "</button>";
    }).join("");
    $("bnav").innerHTML = tabs.map(function (t) {
      return '<button data-act="tab" data-k="' + t.k + '" aria-current="' + (S.tab === t.k) + '"><span class="pillbg">' + ic(t.i) + "</span>" + t.n +
        (t.b ? '<span class="badge" aria-label="' + t.b + ' para revisar">' + t.b + "</span>" : "") + "</button>";
    }).join("");
    var h;
    if (S.tab === "tarefas") h = pageTasks();
    else if (S.tab === "alunos") h = pageStudents();
    else if (S.tab === "modulos") h = pageModules();
    else if (S.tab === "backup") h = pageBackup();
    else h = pageMaterials();
    $("main").innerHTML = h;
  }
  function pageHead(title, sub, action) {
    return '<div class="ph"><div><h2>' + title + "</h2>" + (sub ? "<p>" + sub + "</p>" : "") + "</div>" + (action || "") + "</div>";
  }
  function emptyBig(icon, title, text, action) {
    return '<div class="emptybig"><div class="eic">' + ic(icon, "lg") + "</div><h3>" + title + '</h3><p class="note">' + text + "</p>" + (action || "") + "</div>";
  }

  /* tarefas */
  function pageTasks() {
    var list = allTasks();
    if (isT()) {
      if (S.fStu) list = list.filter(function (t) { return t.uid === S.fStu; });
      if (S.fMod) list = list.filter(function (t) { return t.moduleId === S.fMod; });
    }
    list.sort(sortT);
    var cnt = {}; ST.forEach(function (s) { cnt[s.k] = 0; });
    list.forEach(function (t) { cnt[t.status] = (cnt[t.status] || 0) + 1; });
    var late = list.filter(isLate).length;
    var total = list.length, fin = cnt.done + cnt.reviewed;

    var head;
    if (isT()) {
      head = pageHead("Tarefas", "Acompanhe a prática de cada aluno depois da aula.", '<button class="btn pri" data-act="newTask">' + ic("plus") + "Nova tarefa</button>");
      head += '<div class="stats">' +
        stat("done", "check", "Para revisar", cnt.done) +
        stat("late", "clock", "Atrasadas", late) +
        stat("doing", "play", "Praticando", cnt.doing) +
        stat("todo", "circle", "A fazer", cnt.todo) + "</div>";
    } else {
      var pct = total ? Math.round(fin / total * 100) : 0;
      head = pageHead("Olá, " + esc(nm(S.who).split(" ")[0]) + "!", "Estas são as suas tarefas de prática.");
      head += '<div class="hero"><div class="ring" style="--p:' + pct + '" role="img" aria-label="' + pct + '% concluído"><span>' + pct + '%</span></div><div>' +
        "<h3>" + fin + " de " + total + " tarefas feitas</h3><p>" + (total && fin === total ? "Tudo em dia. Continue praticando!" : "Um pouco por dia faz toda a diferença.") + "</p>" +
        (late ? '<span class="late-chip">' + ic("clock", "sm") + late + " atrasada" + (late > 1 ? "s" : "") + "</span>" : "") + "</div></div>";
    }

    var bar = '<div class="bar"><div class="grp">' +
      '<div class="seg" role="group" aria-label="Modo de exibição">' +
      '<button data-act="view" data-k="quadro" aria-pressed="' + (S.view === "quadro") + '">' + ic("board", "sm") + "Quadro</button>" +
      '<button data-act="view" data-k="lista" aria-pressed="' + (S.view === "lista") + '">' + ic("list", "sm") + "Lista</button></div>";
    if (isT()) {
      bar += '<select data-chg="fStu" aria-label="Filtrar por aluno"><option value="">Todos os alunos</option>' +
        D.students.map(function (s) { return '<option value="' + esc(s.id) + '"' + (S.fStu === s.id ? " selected" : "") + ">" + esc(s.name) + "</option>"; }).join("") + "</select>" +
        '<select data-chg="fMod" aria-label="Filtrar por módulo"><option value="">Todos os módulos</option>' +
        modules().map(function (m) { return '<option value="' + esc(m.id) + '"' + (S.fMod === m.id ? " selected" : "") + ">" + esc(m.title) + "</option>"; }).join("") + "</select>";
    }
    bar += "</div></div>";

    if (!total) {
      var msg = isT()
        ? (D.students.length ? "Envie a primeira tarefa depois da aula. Você pode partir de um tópico da apostila." : "Comece cadastrando seus alunos e escolhendo os módulos de cada um.")
        : "Depois da aula, as tarefas do professor aparecem aqui.";
      var act = isT() ? (D.students.length ? '<button class="btn pri" data-act="newTask">' + ic("plus") + "Nova tarefa</button>" : '<button class="btn pri" data-act="addStudent">' + ic("plus") + "Adicionar aluno</button>") : "";
      return head + emptyBig("inbox", "Nenhuma tarefa por aqui", msg, act);
    }
    return head + bar + (S.view === "quadro" ? board(list) : listView(list));
  }
  function stat(cls, icon, label, v) {
    return '<div class="stat"><div class="k"><span class="dot ' + cls + '">' + ic(icon, "sm") + "</span>" + label + '</div><div class="v">' + v + "</div></div>";
  }
  function dueTag(t) {
    if (!t.due) return "";
    return '<span class="pill ' + (isLate(t) ? "late" : "") + '">' + ic(isLate(t) ? "clock" : "calendar", "sm") + (isLate(t) ? "Atrasada · " : "Até ") + fmtD(t.due) + "</span>";
  }
  function card(t) {
    var n = nextOf(t);
    return '<article class="card ' + t.status + (isLate(t) ? " late" : "") + '" tabindex="0" draggable="true" data-act="open" data-id="' + esc(t.id) + '" aria-label="' + esc(t.title) + ", " + stOf(t.status).n + '">' +
      ((t.moduleId || t.due) ? '<div class="meta">' + (t.moduleId ? '<span class="tag">' + esc(modName(t.moduleId)) + "</span>" : "") + dueTag(t) + "</div>" : "") +
      "<h4>" + esc(t.title) + "</h4>" +
      (isT() ? '<div class="stu">' + avImg(t.uid) + "<span>" + esc(nm(t.uid)) + "</span></div>" : "") +
      (t.feedback ? '<div class="fb">' + ic("message", "sm") + "<span>" + esc(t.feedback) + "</span></div>" : "") +
      (n ? '<button class="btn sm block" data-act="adv" data-id="' + esc(t.id) + '">' + ic(n.i, "sm") + n.n + "</button>" : "") +
      "</article>";
  }
  function board(list) {
    return '<div class="board">' + ST.map(function (s) {
      var items = list.filter(function (t) { return t.status === s.k; });
      return '<section class="col" data-drop="' + s.k + '" aria-label="' + s.n + '"><header><span class="sd ' + s.k + '"></span>' + s.n + "<b>" + items.length + "</b></header>" +
        (items.length ? items.map(card).join("") : '<div class="empty">Nada aqui</div>') + "</section>";
    }).join("") + "</div>";
  }
  function listView(list) {
    var groups = [
      { n: "Para fazer", f: function (t) { return t.status === "todo" || t.status === "doing"; } },
      { n: "Feitas, aguardando revisão", f: function (t) { return t.status === "done"; } },
      { n: "Revisadas", f: function (t) { return t.status === "reviewed"; } }
    ];
    return groups.map(function (g) {
      var items = list.filter(g.f);
      if (!items.length) return "";
      return '<div class="lsec"><h3>' + g.n + " · " + items.length + "</h3>" + items.map(row).join("") + "</div>";
    }).join("");
  }
  function row(t) {
    var lead, st = stOf(t.status);
    if (isT()) lead = avImg(t.uid, "lg");
    else if (t.status === "reviewed") lead = '<span class="chk lock" aria-hidden="true"><i>' + ic("check", "sm") + "</i></span>";
    else lead = '<button class="chk' + (t.status === "done" ? " on" : "") + '" data-act="toggle" data-id="' + esc(t.id) + '" aria-label="' + (t.status === "done" ? "Desmarcar" : "Marcar como feita") + '" aria-pressed="' + (t.status === "done") + '"><i>' + ic("check", "sm") + "</i></button>";
    return '<div class="row" tabindex="0" data-act="open" data-id="' + esc(t.id) + '">' + lead +
      '<div class="grow"><b>' + esc(t.title) + '</b><div class="meta">' +
      (isT() ? "<span>" + esc(nm(t.uid)) + "</span>" : "") +
      (t.moduleId ? '<span class="tag">' + esc(modName(t.moduleId)) + "</span>" : "") + dueTag(t) +
      '<span class="pill ' + t.status + '">' + ic(st.i, "sm") + st.n + "</span></div></div>" +
      '<span class="go">' + ic("right") + "</span></div>";
  }

  /* alunos */
  function pageStudents() {
    var h = pageHead("Alunos", D.students.length ? D.students.length + (D.students.length > 1 ? " alunos cadastrados" : " aluno cadastrado") : "Cadastre quem faz aula com você.",
      '<button class="btn pri" data-act="addStudent">' + ic("plus") + "Adicionar aluno</button>");
    if (!D.students.length) return h + emptyBig("users", "Ainda sem alunos", "Adicione cada aluno pelo nome e escolha os módulos da apostila que ele está estudando.");
    h += '<div class="grid">' + D.students.map(function (s) {
      var u = s.id, mine = s.moduleIds || [];
      var ts = D.tasks.filter(function (t) { return t.uid === u; });
      var fin = ts.filter(function (t) { return t.status === "done" || t.status === "reviewed"; }).length;
      var rev = ts.filter(function (t) { return t.status === "done"; }).length;
      var late = ts.filter(isLate).length;
      var pct = ts.length ? Math.round(fin / ts.length * 100) : 0;
      return '<div class="panelbox"><div class="stu">' + avImg(u, "lg") + '<div style="min-width:0"><h3>' + esc(s.name) + '</h3><span class="note">' + fin + " de " + ts.length + " tarefas feitas</span></div></div>" +
        '<div class="prog" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso de ' + esc(s.name) + '"><i style="width:' + pct + '%"></i></div>' +
        ((rev || late) ? '<div class="meta">' + (rev ? '<span class="pill done">' + ic("check", "sm") + rev + " para revisar</span>" : "") + (late ? '<span class="pill late">' + ic("clock", "sm") + late + " atrasada" + (late > 1 ? "s" : "") + "</span>" : "") + "</div>" : "") +
        '<div><div class="lbl" style="margin-bottom:8px">Módulos</div><div class="chips">' +
        modules().map(function (m) {
          var on = mine.indexOf(m.id) > -1;
          return '<button class="chip" data-act="togMod" data-u="' + esc(u) + '" data-m="' + esc(m.id) + '" aria-pressed="' + on + '">' + (on ? ic("check", "sm") : "") + esc(m.title) + "</button>";
        }).join("") + "</div></div>" +
        '<div class="btns"><button class="btn sm danger' + (S.confirm === "s:" + u ? " on" : "") + '" data-act="rmStu" data-u="' + esc(u) + '">' + ic("trash", "sm") + (S.confirm === "s:" + u ? "Confirmar remoção" : "Remover") + "</button>" +
        '<button class="btn sm pri" data-act="newTask" data-u="' + esc(u) + '">' + ic("plus", "sm") + "Nova tarefa</button></div></div>";
    }).join("") + "</div>";
    return h;
  }

  /* módulos e materiais (professor) / materiais (aluno) */
  function topicsHtml(m) {
    var tp = m.topics || [];
    if (!tp.length) return '<p class="note">Nenhum tópico cadastrado.</p>';
    return '<ol class="topics">' + tp.map(function (t) {
      return "<li><div><b>" + esc(t.t) + "</b>" + (t.d ? "<small>" + esc(t.d) + "</small>" : "") + "</div></li>";
    }).join("") + "</ol>";
  }
  function matsHtml(m, edit) {
    var ms = m.materials || [];
    if (!ms.length) return '<p class="note">' + (edit ? "Nenhum material ainda. Adicione vídeos, PDFs ou links de apoio." : "O professor ainda não colocou materiais neste módulo.") + "</p>";
    return '<div class="mats">' + ms.map(function (x) {
      var k = x.kind || "Link";
      return '<div class="mat"><span class="mk">' + ic(KIND_IC[k] || "link") + '</span><a href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener noreferrer"><span class="kind">' + esc(k) + "</span>" + esc(x.title) + "</a>" +
        (edit ? '<button class="btn sm danger' + (S.confirm === "x:" + x.id ? " on" : "") + '" data-act="rmMat" data-m="' + esc(m.id) + '" data-x="' + esc(x.id) + '" aria-label="Remover ' + esc(x.title) + '">' + (S.confirm === "x:" + x.id ? "Confirmar" : ic("trash", "sm")) + "</button>" : "") + "</div>";
    }).join("") + "</div>";
  }
  function accordion(m, edit) {
    var open = S.openMod === m.id, mi = modIcon(m);
    var h = '<div class="acc"><button class="h" data-act="openMod" data-m="' + esc(m.id) + '" aria-expanded="' + open + '">' +
      '<span class="mi ' + (mi === "mic" ? "canto" : "") + '">' + ic(mi) + "</span>" +
      '<span class="ht"><strong>' + esc(m.title) + '</strong><span class="note">' + esc(m.summary || "") + "</span></span>" +
      '<span class="cnt">' + (m.topics || []).length + " tópicos</span>" +
      '<span class="chev">' + ic("chevron") + "</span></button>";
    if (open) {
      h += '<div class="body"><div><div class="lbl" style="margin-bottom:10px">Conteúdo da apostila</div>' + topicsHtml(m) + "</div>" +
        '<div><div class="lbl" style="margin-bottom:10px">Materiais</div>' + matsHtml(m, edit) + "</div>";
      if (edit) h += '<div class="btns"><button class="btn sm" data-act="editTopics" data-m="' + esc(m.id) + '">' + ic("pencil", "sm") + 'Editar tópicos</button><button class="btn sm pri" data-act="addMat" data-m="' + esc(m.id) + '">' + ic("plus", "sm") + "Material</button></div>";
      h += "</div>";
    }
    return h + "</div>";
  }
  function pageModules() {
    return pageHead("Apostila", "Tópicos de cada módulo e os materiais de apoio.") + modules().map(function (m) { return accordion(m, true); }).join("");
  }
  function pageMaterials() {
    var s = stuById(S.who), mine = (s && s.moduleIds) || [];
    var ms = modules().filter(function (m) { return mine.indexOf(m.id) > -1; });
    var h = pageHead("Materiais", "O conteúdo dos módulos que você está estudando.");
    if (!ms.length) return h + emptyBig("book", "Nenhum módulo liberado", "Quando o professor liberar o seu módulo, a apostila e os materiais aparecem aqui.");
    return h + ms.map(function (m) { return accordion(m, false); }).join("");
  }

  /* backup */
  function pageBackup() {
    return pageHead("Backup", "Guarde uma cópia e leve os dados para outro aparelho.") +
      '<div class="grid">' +
      '<div class="panelbox"><div class="stu"><span class="mat" style="border:0;padding:0"><span class="mk">' + ic("shield") + '</span></span><h3>Seus dados ficam neste navegador</h3></div>' +
      '<p class="note">Alunos, tarefas, tópicos e materiais são salvos só neste aparelho e neste navegador. Exporte de vez em quando para ter uma cópia de segurança.</p>' +
      '<div class="btns" style="justify-content:flex-start"><button class="btn pri" data-act="export">' + ic("save", "sm") + 'Exportar dados</button><button class="btn" data-act="import">' + ic("upload", "sm") + "Importar arquivo</button></div>" +
      '<p class="note">Importar substitui tudo o que está aqui pelo conteúdo do arquivo.</p></div>' +
      '<div class="panelbox"><div class="stu"><span class="mat" style="border:0;padding:0"><span class="mk" style="background:var(--late-bg);color:var(--late)">' + ic("reset") + '</span></span><h3>Começar do zero</h3></div>' +
      '<p class="note">Apaga alunos, tarefas e materiais e volta a apostila ao conteúdo original. Não dá para desfazer.</p>' +
      '<div class="btns" style="justify-content:flex-start"><button class="btn danger' + (S.confirm === "reset" ? " on" : "") + '" data-act="reset">' + ic("trash", "sm") + (S.confirm === "reset" ? "Confirmar: apagar tudo" : "Apagar tudo") + "</button></div></div>" +
      "</div>";
  }
  function doExport() {
    var blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "caderno-de-pratica-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Arquivo exportado");
  }
  function doImport(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (!valid(o)) throw new Error("formato");
        D = o; save(); S.fStu = ""; S.fMod = ""; render(); toast("Dados importados");
      } catch (e) { toast("Esse arquivo não é um backup do caderno."); }
    };
    r.readAsText(file);
  }

  /* ---------- folhas ---------- */
  var lastFocus = null;
  function openSheet(o) { lastFocus = document.activeElement; S.sheet = o; paintSheet(true); }
  function closeSheet() {
    S.sheet = null; var s = $("sheet"); s.hidden = true; s.innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function sheetHead(title, pre) {
    return '<div class="grab" aria-hidden="true"></div><div class="hd"><div style="display:grid;gap:8px;min-width:0">' + (pre || "") + '<h2 id="sheetTitle">' + title + '</h2></div><button class="iconbtn" data-act="close" aria-label="Fechar">' + ic("x") + "</button></div>";
  }
  function paintSheet(first) {
    var o = S.sheet, s = $("sheet");
    if (!o) return;
    var h = "";
    if (o.type === "task") h = sheetTask(o);
    else if (o.type === "new") h = sheetNew(o);
    else if (o.type === "addStu") h = sheetAddStu();
    else if (o.type === "topics") h = sheetTopics(o);
    else if (o.type === "mat") h = sheetMat(o);
    if (!h) { closeSheet(); return; }
    s.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' + h + "</div>";
    s.hidden = false;
    if (first) {
      var f = s.querySelector("input[type=text], textarea") ;
      if (f && o.type !== "task") f.focus(); else s.querySelector(".iconbtn").focus();
    }
  }
  function sheetTask(o) {
    var t = findTask(o.id);
    if (!t) return "";
    var pre = (t.moduleId || t.due) ? '<div class="meta">' + (t.moduleId ? '<span class="tag">' + esc(modName(t.moduleId)) + "</span>" : "") + dueTag(t) + "</div>" : "";
    var h = sheetHead(esc(t.title), pre);
    if (isT()) h += '<div class="stu">' + avImg(t.uid) + "<span>" + esc(nm(t.uid)) + "</span></div>";
    if (t.note) h += '<div class="field"><span class="lbl">Orientação</span><p class="desc">' + esc(t.note) + "</p></div>";
    h += '<div class="field"><span class="lbl" id="stLbl">Andamento</span><div class="stseg" role="group" aria-labelledby="stLbl">' + ST.map(function (s) {
      var ok = canSet(t, s.k);
      return '<button data-act="setSt" data-k="' + s.k + '" aria-pressed="' + (t.status === s.k) + '"' + (ok ? "" : " disabled") + ">" + ic(s.i, "sm") + s.n + "</button>";
    }).join("") + "</div>" + (!isT() && t.status === "reviewed" ? '<span class="help">Esta tarefa já foi revisada pelo professor.</span>' : "") + "</div>";
    if (isT()) {
      h += '<div class="field"><label for="fb">Retorno para o aluno</label><textarea id="fb" placeholder="Ex.: Ótimo! Na próxima, tente com o metrônomo em 70 BPM.">' + esc(t.feedback || "") + "</textarea></div>" +
        '<div class="btns" style="justify-content:space-between"><button class="btn danger' + (S.confirm === "t:" + t.id ? " on" : "") + '" data-act="delTask">' + ic("trash", "sm") + (S.confirm === "t:" + t.id ? "Confirmar exclusão" : "Excluir") + '</button><button class="btn pri" data-act="saveFb">' + ic("check", "sm") + "Salvar retorno</button></div>";
    } else {
      if (t.feedback) h += '<div class="fbbox"><span class="lbl">' + "Retorno do professor</span><p class=\"desc\">" + esc(t.feedback) + "</p></div>";
    }
    return h;
  }
  function stuChecks(modId, pre) {
    if (!D.students.length) return '<p class="note" style="padding:8px">Nenhum aluno cadastrado ainda.</p>';
    return D.students.map(function (s) {
      var on = pre ? pre === s.id : (modId && (s.moduleIds || []).indexOf(modId) > -1);
      return '<label><input type="checkbox" name="nt-stu" value="' + esc(s.id) + '"' + (on ? " checked" : "") + "> " + avImg(s.id) + esc(s.name) + "</label>";
    }).join("");
  }
  function sheetNew(o) {
    return sheetHead("Nova tarefa") +
      '<div class="two"><div class="field"><label for="nt-mod">Módulo</label><select id="nt-mod" data-chg="ntMod"><option value="">Sem módulo</option>' +
      modules().map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.title) + "</option>"; }).join("") + "</select></div>" +
      '<div class="field"><label for="nt-top">Tópico da apostila</label><select id="nt-top" data-chg="ntTop"><option value="">Escolha o módulo</option></select></div></div>' +
      '<div class="field"><label for="nt-title">Título da tarefa *</label><input type="text" id="nt-title" placeholder="Ex.: Praticar escala de Ré maior"><span class="help">Escolher um tópico preenche o título automaticamente.</span></div>' +
      '<div class="field"><label for="nt-note">Orientação</label><textarea id="nt-note" placeholder="Quanto tempo, quantas vezes, com ou sem metrônomo…"></textarea></div>' +
      '<div class="field"><label for="nt-due">Prazo</label><input type="date" id="nt-due"></div>' +
      '<div class="field"><span class="lbl">Alunos *</span><div class="checks" id="nt-stus">' + stuChecks("", o.u) + "</div></div>" +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="createTask">' + ic("check", "sm") + "Enviar tarefa</button></div>";
  }
  function sheetAddStu() {
    return sheetHead("Adicionar aluno") +
      '<div class="field"><label for="as-name">Nome do aluno *</label><input type="text" id="as-name" placeholder="Ex.: Ana Souza" autocomplete="off"></div>' +
      '<div class="field"><span class="lbl">Módulos que vai estudar</span><div class="checks">' +
      modules().map(function (m) { return '<label><input type="checkbox" name="as-mod" value="' + esc(m.id) + '"> ' + esc(m.title) + "</label>"; }).join("") + "</div></div>" +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="saveStudent">' + ic("plus", "sm") + "Adicionar</button></div>";
  }
  function sheetTopics(o) {
    var m = modById(o.m); if (!m) return "";
    var txt = (m.topics || []).map(function (t) { return t.t + (t.d ? " | " + t.d : ""); }).join("\n");
    return sheetHead("Tópicos de " + esc(m.title)) +
      '<div class="field"><label for="tp-txt">Tópicos</label><textarea id="tp-txt" style="min-height:280px">' + esc(txt) + '</textarea><span class="help">Um tópico por linha. Para incluir uma explicação, escreva “Título | explicação”.</span></div>' +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="saveTopics">' + ic("check", "sm") + "Salvar</button></div>";
  }
  function sheetMat(o) {
    var m = modById(o.m); if (!m) return "";
    return sheetHead("Novo material", '<span class="tag">' + esc(m.title) + "</span>") +
      '<div class="field"><label for="mt-title">Nome do material *</label><input type="text" id="mt-title" placeholder="Ex.: Escalas maiores (PDF)"></div>' +
      '<div class="field"><label for="mt-url">Link *</label><input type="url" id="mt-url" placeholder="https://" inputmode="url"><span class="help">YouTube, Google Drive, site… Para PDFs e áudios, suba o arquivo no Drive e cole o link de compartilhamento.</span></div>' +
      '<div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="saveMat">' + ic("plus", "sm") + "Adicionar</button></div>";
  }

  /* ---------- ações ---------- */
  function val(id) { var e = $(id); return e ? e.value.trim() : ""; }
  function checked(name) { return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; }); }
  function need(id, msg) { toast(msg); var e = $(id); if (e) e.focus(); }

  function createTasks() {
    var title = val("nt-title"), us = checked("nt-stu");
    if (!title) { need("nt-title", "Escreva o título da tarefa."); return; }
    if (!us.length) { toast("Escolha pelo menos um aluno."); return; }
    var now = Date.now();
    us.forEach(function (u) {
      D.tasks.push({ id: rid(), uid: u, title: title, note: val("nt-note"), moduleId: val("nt-mod") || null, due: val("nt-due") || null, status: "todo", feedback: "", createdAt: now, doneAt: null });
    });
    save(); closeSheet(); render();
    toast("Tarefa enviada para " + us.length + (us.length > 1 ? " alunos" : " aluno"));
  }
  function saveStudent() {
    var name = val("as-name");
    if (!name) { need("as-name", "Escreva o nome do aluno."); return; }
    D.students.push({ id: rid(), name: name, moduleIds: checked("as-mod"), createdAt: Date.now() });
    save(); closeSheet(); render(); toast("Aluno adicionado");
  }
  function saveMat() {
    var m = modById(S.sheet.m), title = val("mt-title"), url = val("mt-url");
    if (!title) { need("mt-title", "Dê um nome ao material."); return; }
    if (!/^https?:\/\//.test(url)) { need("mt-url", "Cole um link que comece com https://"); return; }
    m.materials = (m.materials || []).concat([{ id: rid(), title: title, url: url, kind: kindOf(url) }]);
    save(); closeSheet(); render(); toast("Material adicionado");
  }
  function saveTopics() {
    var m = modById(S.sheet.m);
    m.topics = ($("tp-txt").value || "").split("\n").map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var i = l.indexOf("|");
      return i > -1 ? { t: l.slice(0, i).trim(), d: l.slice(i + 1).trim() } : { t: l, d: "" };
    });
    save(); closeSheet(); render(); toast("Tópicos salvos");
  }
  function onModChange() {
    var mid = $("nt-mod").value, m = modById(mid);
    $("nt-top").innerHTML = m && (m.topics || []).length
      ? '<option value="">Escolha um tópico</option>' + m.topics.map(function (t, i) { return '<option value="' + i + '">' + esc(t.t) + "</option>"; }).join("")
      : '<option value="">Escolha o módulo</option>';
    $("nt-stus").innerHTML = stuChecks(mid, null);
  }
  function onTopChange() {
    var m = modById($("nt-mod").value), i = $("nt-top").value;
    if (!m || i === "") return;
    $("nt-title").value = "Praticar: " + m.topics[+i].t;
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) { if (e.target.id === "sheet") closeSheet(); return; }
    var a = el.dataset.act, u = el.dataset.u, id = el.dataset.id, m = el.dataset.m;
    if (a !== "delTask" && a !== "rmMat" && a !== "rmStu" && a !== "reset" && S.confirm) S.confirm = "";
    if (a === "tab") { S.tab = el.dataset.k; pref("tab", S.tab); render(); window.scrollTo(0, 0); $("main").focus({ preventScroll: true }); }
    else if (a === "view") { S.view = el.dataset.k; pref("view", S.view); render(); }
    else if (a === "open") openSheet({ type: "task", id: id });
    else if (a === "adv") { e.stopPropagation(); var t = findTask(id), n = t && nextOf(t); if (n) setStatus(id, n.k); }
    else if (a === "toggle") { e.stopPropagation(); var t2 = findTask(id); if (t2) setStatus(id, t2.status === "done" ? "todo" : "done"); }
    else if (a === "setSt") setStatus(S.sheet.id, el.dataset.k);
    else if (a === "close") closeSheet();
    else if (a === "newTask") openSheet({ type: "new", u: u || null });
    else if (a === "addStudent") openSheet({ type: "addStu" });
    else if (a === "saveStudent") saveStudent();
    else if (a === "togMod") {
      var s = stuById(u), cur = (s.moduleIds || []).slice(), i = cur.indexOf(m);
      if (i > -1) cur.splice(i, 1); else cur.push(m);
      s.moduleIds = cur; save(); render();
    }
    else if (a === "rmStu") {
      if (S.confirm === "s:" + u) {
        S.confirm = "";
        D.students = D.students.filter(function (x) { return x.id !== u; });
        D.tasks = D.tasks.filter(function (x) { return x.uid !== u; });
        if (S.fStu === u) S.fStu = "";
        save(); render(); toast("Aluno removido");
      } else { S.confirm = "s:" + u; render(); }
    }
    else if (a === "openMod") { S.openMod = S.openMod === m ? "" : m; render(); }
    else if (a === "editTopics") openSheet({ type: "topics", m: m });
    else if (a === "addMat") openSheet({ type: "mat", m: m });
    else if (a === "rmMat") {
      var x = el.dataset.x;
      if (S.confirm === "x:" + x) {
        S.confirm = ""; var mod = modById(m);
        mod.materials = (mod.materials || []).filter(function (q) { return q.id !== x; });
        save(); render();
      } else { S.confirm = "x:" + x; render(); }
    }
    else if (a === "createTask") createTasks();
    else if (a === "saveMat") saveMat();
    else if (a === "saveTopics") saveTopics();
    else if (a === "saveFb") { var t3 = findTask(S.sheet.id); if (t3) { t3.feedback = val("fb"); save(); render(); toast("Retorno salvo"); } }
    else if (a === "delTask") {
      var tid = S.sheet.id;
      if (S.confirm === "t:" + tid) {
        S.confirm = "";
        D.tasks = D.tasks.filter(function (q) { return q.id !== tid; });
        save(); closeSheet(); render(); toast("Tarefa excluída");
      } else { S.confirm = "t:" + tid; paintSheet(); }
    }
    else if (a === "export") doExport();
    else if (a === "import") $("importFile").click();
    else if (a === "reset") {
      if (S.confirm === "reset") { S.confirm = ""; D = fresh(); save(); S.who = "prof"; render(); toast("Tudo apagado"); }
      else { S.confirm = "reset"; render(); }
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "importFile") { if (e.target.files[0]) doImport(e.target.files[0]); e.target.value = ""; return; }
    var k = e.target.dataset && e.target.dataset.chg;
    if (k === "who") { S.who = e.target.value; pref("who", S.who); S.tab = ""; closeSheet(); render(); }
    else if (k === "fStu") { S.fStu = e.target.value; render(); }
    else if (k === "fMod") { S.fMod = e.target.value; render(); }
    else if (k === "ntMod") onModChange();
    else if (k === "ntTop") onTopChange();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.sheet) closeSheet();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[data-act="open"]')) { e.preventDefault(); e.target.click(); }
  });
  /* arrastar e soltar (computador e iPad) */
  var drag = null;
  document.addEventListener("dragstart", function (e) {
    var c = e.target.closest && e.target.closest(".card"); if (!c) return;
    drag = c.dataset.id;
    try { e.dataTransfer.setData("text/plain", drag); e.dataTransfer.effectAllowed = "move"; } catch (er) {}
  });
  document.addEventListener("dragover", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (!c || !drag) return;
    e.preventDefault(); c.classList.add("over");
  });
  document.addEventListener("dragleave", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (c) c.classList.remove("over");
  });
  document.addEventListener("drop", function (e) {
    var c = e.target.closest && e.target.closest(".col"); if (!c || !drag) return;
    e.preventDefault(); c.classList.remove("over");
    var d = drag; drag = null; setStatus(d, c.dataset.drop);
  });
  document.addEventListener("dragend", function () { drag = null; });

  /* ---------- início ---------- */
  $("logoMark").innerHTML = ic("music");
  D = load();
  S.who = pref("who") || "prof";
  S.tab = pref("tab") || "";
  S.view = pref("view") === "lista" ? "lista" : "quadro";
  S.openMod = modules().length ? modules()[0].id : "";
  render();
})();
</script>
</body>
</html>
